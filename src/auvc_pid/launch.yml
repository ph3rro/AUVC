from launch import LaunchDescription
from launch_ros.actions import Node


launch:

- node:
    pkg: "auvc_pid"
    exec: "brain"
    name: "auvc_pid_brain"
    namespace: ""

# ============================================
# Depth Controller
# ============================================

- node:
    pkg: "auvc_pid"
    exec: "depth_node"
    name: "depth_node"
    namespace: ""

# ============================================
# Heading PID Controller
# ============================================

- node:
    pkg: "auvc_pid"
    exec: "angular_pid"
    name: "angular_pid"
    namespace: ""

# ============================================
# Manual Publisher
# ============================================

- node:
    pkg: "auvc_pid"
    exec: "publisher_node"
