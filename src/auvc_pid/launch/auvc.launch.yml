launch:
- node:
    pkg: "rosmav"
    exec: "bluerov2_hardware_interface"
    name: "bluerov2_hardware_interface"
    namespace: ""

- node:
    pkg: "rosmav"
    exec: "bluerov2_camera_interface"
    name: "bluerov2_camera_interface"
    namespace: ""

- node:
    pkg: "auvc_pid"
    exec: "brain"
    name: "auvc_pid_brain"
    namespace: ""






- node:
    pkg: "auvc_pid"
    exec: "depth_node"
    name: "depth_node"
    namespace: ""






- node:
    pkg: "auvc_pid"
    exec: "angular_pid"
    name: "angular_pid"
    namespace: ""


- node:
    pkg: "auvc_pid"
    exec: "stream_images"
    name: "stream_images"
    namespace: ""

- node:
    pkg: "auvc_pid"
    exec: "logger_node"
    name: "logger_node"
    namespace: ""

- timer:
    period: 5.0
    children: #claude gave me this if theres any errors delete this maybe
    - executable:
        cmd: 'ros2 service call /arming std_srvs/srv/SetBool "{data: true}"'
        name: "arm_auv"
        output: "screen"
