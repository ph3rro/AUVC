launch:
  # Toggle recording on/off from the command line
  - arg:
      name: "record"
      default: "true"
      description: "Whether to record a bag file (true/false)"

  - arg:
      name: "final_challenge"
      default: "platform_six_and_three_quarters"
      description: "Name of the output bag directory"

  - arg:
      name: "target_depth"
      default: "2.5"
      description: "Target depth in meters"

  # Your vehicle's nodes go here
  - node:
      pkg: "rosmav"
      exec: "bluerov2_hardware_interface"
      name: "bluerov2_hardware_interface"
      namespace: ""

  - node:
      pkg: "rosmav"
      exec: "bluerov2_camera_interface"
      name: "bluerov2_camera_interface"
      namespace: ""

  - node:
      pkg: "auvc_pid"
      exec: "brain"
      name: "brain"
      namespace: ""

  - node:
      pkg: "auvc_pid"
      exec: "depth_node"
      name: "depth_node"
      namespace: ""

  - node:
      pkg: "auvc_pid"
      exec: "angular_pid"
      name: "angular_pid"
      namespace: ""

  - node:
      pkg: "auvc_pid"
      exec: "stream_images"
      name: "stream_images"
      namespace: ""

  - executable:
      cmd: 'ros2 service call /arming std_srvs/srv/SetBool "{data: true}"'
      name: "arm_auv"
      output: "screen"
    
  - executable:
      cmd: "ros2 bag record -s mcap -o $(var qualifiers) --topics /heading /current_depth /manual_control /yolo_detected /distance /fire_control"
      output: "screen"
      if: "$(var record)"


