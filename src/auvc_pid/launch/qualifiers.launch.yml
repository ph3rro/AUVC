launch:
  # Toggle recording on/off from the command line
  - arg:
      name: "record"
      default: "true"
      description: "Whether to record a bag file (true/false)"

  # - arg:
  #     name: "qualifiers"
  #     default: "platform_six_and_three_quarters"
  #     description: "Name of the output bag directory"

  - arg:
      name: "target_depth"
      default: "2.5"
      description: "Target depth in meters"

  - arg:
      name: "target_heading"
      default: "170.0"
      description: "Target heading in degrees"
    
  - arg:
      name: "target_forward_speed"
      default: "0.0"
      description: "Target forward speed in m/s"

  # Your vehicle's nodes go here
  - node:
      pkg: "rosmav"
      exec: "bluerov2_hardware_interface"
      name: "bluerov2_hardware_interface"
      namespace: ""

  - node:
      pkg: "auvc_pid"
      exec: "publisher_node"
      name: "publisher_node"
      namespace: ""

  - node:
      pkg: "auvc_pid"
      exec: "depth_node"
      name: "depth_node"
      namespace: ""

  - node:
      pkg: "auvc_pid"
      exec: "angular_pid"
      name: "angular_pid"
      namespace: ""

  - executable:
      cmd: 'ros2 service call /arming std_srvs/srv/SetBool "{data: true}"'
      name: "arm_auv"
      output: "screen"
  - executable:
      cmd: 'ros2 topic pub /target_depth std_msgs/msg/Float64 "{data: "$(var target_depth)"}"'
      name: "set_target_depth"
      output: "screen"
  - executable:
      cmd: 'ros2 topic pub /target_heading std_msgs/msg/Float64 "{data: "$(var target_heading)"}"'
      name: "set_target_heading"
      output: "screen"
  - executable:
      cmd: 'ros2 topic pub /forward std_msgs/msg/Float64 "{data: "$(var target_forward_speed)"}"'
      name: "set_target_forward_speed"
      output: "screen"

  - executable:
      cmd: "ros2 bag record -s mcap -o $(var qualifiers) --topics /heading /current_depth /manual_control"
      output: "screen"
      if: "$(var record)"
    
  # Record only the topics we care about
  # - executable:
  #     cmd: "ros2 bag qualifiers -s mcap -o $(var qualifiers) /current_heave /current_depth /target_depth /target_heading"
  #     output: "screen"
  #     if: "$(var qualifiers)"
